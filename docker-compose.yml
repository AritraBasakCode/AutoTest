services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autotest
      POSTGRES_USER: autotest
      POSTGRES_PASSWORD: autotest-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - autotest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotest -d autotest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autotest-postgres:
